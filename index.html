<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ระบบจองใช้ห้องประชุมไทยเอกลักษณ์ แจ้งผ่านไลน์</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512.png">

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIS Meet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  font-family: sans-serif;
  overflow: hidden;
}

#loader {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.8s ease;
}

#loader.fadeout {
  opacity: 0;
  pointer-events: none;
}

.bar-loader {
  width: 120px;
  max-width: 60%;
  height: 14px;
  background: #ececec;
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}

.bar-inner {
  width: 40px;
  height: 100%;
  background: #4285f4;
  border-radius: 7px;
  position: absolute;
  left: -40px;
  animation: barmove 1.5s infinite linear;
}

@keyframes barmove {
  0% {
    left: -40px;
  }

  100% {
    left: 120px;
  }
}

#content-iframe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 1;
}

#content-iframe.visible {
  opacity: 1;
}

#installBox {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 400px;
  box-sizing: border-box;
  background: #ffffff;
  border-radius: 18px;
  padding: 24px 20px 20px;
  box-shadow: 0 8px 35px rgba(0,0,0,0.20);
  z-index: 10000;
  text-align: center;
  display: none;
}

#installIcon {
  width: 72px;
  height: 72px;
  border-radius: 16px;
  object-fit: cover;
  margin-bottom: 12px;
}

#installBox h3 {
  margin: 0 0 8px;
  font-size: 20px;
  color: #222222;
}

#installBox p {
  margin: 0 0 18px;
  font-size: 14px;
  line-height: 1.7;
  color: #666666;
}

#installBtn {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 13px;
  background: #0d6efd;
  color: #ffffff;
  font-size: 16px;
  cursor: pointer;
}

#closeInstall {
  width: 100%;
  margin-top: 9px;
  border: none;
  background: transparent;
  color: #777777;
  font-size: 14px;
  padding: 8px;
  cursor: pointer;
}

#iosInfo {
  display: none;
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.7;
  color: #666666;
}
</style>

</head>

<body>

<div id="loader">
  <div class="bar-loader">
    <div class="bar-inner"></div>
  </div>
</div>

<div id="installBox">

<img
 id="installIcon"
 src="./icon-512.png"
 alt="TIS Meet">

  <h3>ติดตั้ง TIS Meet</h3>

  <p>
    ติดตั้งระบบไว้ที่หน้าจอมือถือ
    เพื่อเปิดใช้งานได้สะดวกเหมือน Application
  </p>

  <button id="installBtn">
    ติดตั้งเป็น App
  </button>

  <div id="iosInfo">
    กดปุ่ม <b>แชร์</b> ของ Safari<br>
    แล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b>
  </div>

  <button id="closeInstall">
    ใช้งานผ่านเว็บไซต์
  </button>

</div>

<iframe
  id="content-iframe"
  src="https://script.google.com/macros/s/AKfycbxogYrC7Fkh4fMLf7Ecbaki6Jk5AHikJTrtZGlDHSV9ylff62BoSy6waHBAA1YHgsfg/exec">
</iframe>

<script>

const loader = document.getElementById('loader');
const iframe = document.getElementById('content-iframe');

const installBox = document.getElementById('installBox');
const installBtn = document.getElementById('installBtn');
const closeInstall = document.getElementById('closeInstall');
const iosInfo = document.getElementById('iosInfo');

let deferredPrompt = null;


/* ตรวจสอบว่าเปิดจาก App ที่ติดตั้งแล้ว */

function isInstalledApp() {

  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;

}


/* Android / Chrome */

window.addEventListener('beforeinstallprompt', function(e) {

  e.preventDefault();

  deferredPrompt = e;

});


/* แสดงคำแนะนำติดตั้งเมื่อเปิดจากเว็บไซต์ */

window.addEventListener('load', function() {

  if (isInstalledApp()) {
    installBox.style.display = 'none';
    return;
  }

  const isIOS =
    /iphone|ipad|ipod/i.test(navigator.userAgent);

  const isSafari =
    /safari/i.test(navigator.userAgent) &&
    !/crios|fxios|edgios/i.test(navigator.userAgent);

  if (isIOS && isSafari) {

    installBox.style.display = 'block';

    installBtn.style.display = 'none';

    iosInfo.style.display = 'block';

  } else {

    installBox.style.display = 'block';

  }

});


/* ปุ่มติดตั้ง */

installBtn.addEventListener('click', async function() {

  if (deferredPrompt) {

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    deferredPrompt = null;

    installBox.style.display = 'none';

    return;

  }

  alert(
    'หากปุ่มติดตั้งยังไม่แสดง ให้เปิดเมนูของเบราว์เซอร์ แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มไปยังหน้าจอหลัก"'
  );

});


/* ปิดคำแนะนำ */

closeInstall.addEventListener('click', function() {

  installBox.style.display = 'none';

});


/* เมื่อติดตั้งสำเร็จ */

window.addEventListener('appinstalled', function() {

  installBox.style.display = 'none';

});


/* เมื่อ iframe โหลดเสร็จ */

iframe.addEventListener('load', function() {

  setTimeout(function() {

    loader.classList.add('fadeout');

    setTimeout(function() {

      loader.style.display = 'none';

      iframe.classList.add('visible');

    }, 800);

  }, 300);

});


/* ป้องกันปุ่มย้อนกลับ */

history.pushState(null, null, location.href);

window.addEventListener('popstate', function() {

  const confirmExit = confirm('ต้องการออกจากหน้านี้หรือไม่ ?');

  if (confirmExit) {

    history.back();

  } else {

    history.pushState(null, null, location.href);

  }

});

</script>

</body>
</html>
