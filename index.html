<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ระบบจองใช้ห้องประชุมไทยเอกลักษณ์ แจ้งผ่านไลน์</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512.png">

<meta name="theme-color" content="#ffffff">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIS Meet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  font-family: sans-serif;
  overflow: hidden;
}

#loader {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.8s ease;
}

#loader.fadeout {
  opacity: 0;
  pointer-events: none;
}

.bar-loader {
  width: 120px;
  max-width: 60%;
  height: 14px;
  background: #ececec;
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}

.bar-inner {
  width: 40px;
  height: 100%;
  background: #4285f4;
  border-radius: 7px;
  position: absolute;
  left: -40px;
  animation: barmove 1.5s infinite linear;
}

@keyframes barmove {
  0% {
    left: -40px;
  }

  100% {
    left: 120px;
  }
}

#content-iframe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 1;
}

#content-iframe.visible {
  opacity: 1;
}

#installBox {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 420px;
  box-sizing: border-box;
  background: #ffffff;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 5px 30px rgba(0,0,0,0.18);
  z-index: 10000;
  display: none;
  text-align: center;
}

#installBox h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
  color: #222222;
}

#installBox p {
  margin: 0 0 15px 0;
  font-size: 14px;
  line-height: 1.6;
  color: #666666;
}

#installBtn {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #0d6efd;
  color: #ffffff;
  font-size: 16px;
  cursor: pointer;
}

#closeInstall {
  margin-top: 10px;
  border: none;
  background: transparent;
  color: #777777;
  font-size: 14px;
  cursor: pointer;
}

#iosInfo {
  display: none;
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.6;
  color: #666666;
}
</style>
</head>

<body>

<div id="loader">
  <div class="bar-loader">
    <div class="bar-inner"></div>
  </div>
</div>

<div id="installBox">

  <h3>ติดตั้ง TIS Meet</h3>

  <p>
    สามารถติดตั้งระบบไว้ที่หน้าจอมือถือ
    เพื่อเปิดใช้งานได้เหมือน Application
  </p>

  <button id="installBtn">
    ติดตั้งเป็น App
  </button>

  <div id="iosInfo">
    สำหรับ iPhone/iPad<br>
    กดปุ่ม <b>แชร์</b> แล้วเลือก<br>
    <b>เพิ่มไปยังหน้าจอโฮม</b>
  </div>

  <button id="closeInstall">
    ปิด
  </button>

</div>

<iframe
  id="content-iframe"
  src="https://script.google.com/macros/s/AKfycbxogYrC7Fkh4fMLf7Ecbaki6Jk5AHikJTrtZGlDHSV9ylff62BoSy6waHBAA1YHgsfg/exec">
</iframe>

<script>

const loader = document.getElementById('loader');
const iframe = document.getElementById('content-iframe');

const installBox = document.getElementById('installBox');
const installBtn = document.getElementById('installBtn');
const closeInstall = document.getElementById('closeInstall');
const iosInfo = document.getElementById('iosInfo');

let deferredPrompt = null;


/* ตรวจสอบว่าเปิดจาก App ที่ติดตั้งแล้วหรือไม่ */

function isInstalledApp() {

  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;

}


/* Android / Chrome */

window.addEventListener('beforeinstallprompt', function(e) {

  e.preventDefault();

  deferredPrompt = e;

  if (!isInstalledApp()) {
    installBox.style.display = 'block';
  }

});


/* ปุ่มติดตั้ง */

installBtn.addEventListener('click', async function() {

  if (!deferredPrompt) {
    return;
  }

  deferredPrompt.prompt();

  const result = await deferredPrompt.userChoice;

  deferredPrompt = null;

  installBox.style.display = 'none';

});


/* ปิดคำแนะนำติดตั้ง */

closeInstall.addEventListener('click', function() {

  installBox.style.display = 'none';

});


/* iPhone / iPad */

const isIOS =
  /iphone|ipad|ipod/i.test(window.navigator.userAgent);

const isSafari =
  /safari/i.test(window.navigator.userAgent) &&
  !/crios|fxios|edgios/i.test(window.navigator.userAgent);

if (isIOS && isSafari && !isInstalledApp()) {

  installBox.style.display = 'block';

  installBtn.style.display = 'none';

  iosInfo.style.display = 'block';

}


/* เมื่อเปิดเป็น App แล้ว ไม่ต้องแสดงคำแนะนำติดตั้ง */

if (isInstalledApp()) {

  installBox.style.display = 'none';

}


/* แสดงระบบเมื่อ iframe โหลดเสร็จ */

iframe.addEventListener('load', function() {

  setTimeout(function() {

    loader.classList.add('fadeout');

    setTimeout(function() {

      loader.style.display = 'none';

      iframe.classList.add('visible');

    }, 800);

  }, 300);

});


/* ป้องกันปุ่มย้อนกลับ */

history.pushState(null, null, location.href);

window.addEventListener('popstate', function() {

  const confirmExit = confirm('ต้องการออกจากหน้านี้หรือไม่ ?');

  if (confirmExit) {

    history.back();

  } else {

    history.pushState(null, null, location.href);

  }

});


/* ไม่บล็อก beforeunload
   เพื่อไม่ให้มือถือแสดงข้อความเตือน
   ตอนปิด App / เปลี่ยนหน้า */

</script>

</body>
</html>
